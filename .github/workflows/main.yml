---
name: main
# aca-model is a git submodule of the aca-dev workspace and has no pixi config
# of its own — the pixi environments live in the parent workspace, whose
# `tests-cpu` env has editable path-dependencies on private sibling repos that a
# standalone CI runner cannot clone. CI therefore installs with pip directly.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
jobs:
  run-tests:
    name: Run ${{ matrix.shard.name }} tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.14'
        # The medical-cost timing module compiles and simulates a model of its
        # own, which takes longer than any other module; it runs in parallel.
        shard:
          - name: main
            args: -n 4 --dist loadscope --ignore=tests/test_medical_cost_timing.py tests
          - name: timing
            args: tests/test_medical_cost_timing.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pylcm at the supported API revision
        # Pinned by commit so a deleted or rewritten branch cannot break the
        # install; keep it compatible with the model's graph declarations.
        run: >-
          pip install "pylcm @
          git+https://github.com/OpenSourceEconomics/pylcm.git@5660c4f30efa5b753bbd3698a5a78bdb08a8824e"
      - name: Install aca-model with test deps
        run: pip install -e . pytest pytest-xdist pdbp
      - name: Run pytest
        run: pytest --durations=40 ${{ matrix.shard.args }}

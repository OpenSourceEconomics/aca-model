---
name: main
# aca-model is a git submodule of the aca-dev workspace and has no pixi config
# of its own — the pixi environments live in the parent workspace, whose
# `tests-cpu` env has editable path-dependencies on private sibling repos that a
# standalone CI runner cannot clone. CI therefore installs with pip directly.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
jobs:
  run-tests:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pylcm at the revision aca-dev pins
        # Pinned by commit so a deleted or rewritten branch cannot break the
        # install; move it together with the aca-dev pylcm submodule pointer.
        run: >-
          pip install "pylcm @
          git+https://github.com/OpenSourceEconomics/pylcm.git@a37267e7220db9763fc51f149836b079780b3713"
      - name: Install aca-model with test deps
        run: pip install -e . pytest pdbp
      - name: Run pytest
        run: pytest tests
